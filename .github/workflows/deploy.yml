name: Publicar en el servidor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Aviso si faltan los datos FTP
        if: env.HAS_FTP != 'true'
        run: echo "Faltan los secretos FTP_SERVER, FTP_USERNAME, FTP_PASSWORD y FTP_DIR. No se publica."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - name: Subir por FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
